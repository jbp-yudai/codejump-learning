<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="日々の料理レシピをまとめています。和食や洋食、中華、お菓子までいろいろな料理レシピをアップしています。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ress@4.0.0/dist/ress.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Recipe Diary</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__visual">
                <img class="header__visual-img" src="images/mainvisual.jpg" alt="テーブルに並んだ料理の写真" width="1200" height="600" loading="eager">
            </div>
            <div class="header__inner">
                <h1 class="header__title">Recipe Diary</h1>
                <p class="header__text">日々の料理レシピをまとめています。</p>
                <p class="header__text">和食や洋食、中華、お菓子までいろいろな料理レシピをアップしていますので、</p>
                <p class="header__text">みなさんの献立にお役立てくださいね！</p>
            </div>
        </header>
        <main class="main">
            <div class="recipe-list">
                <ul class="recipe-list__items">
                    <li class="recipe-list__item">
                        <a class="recipe-list__link" href="#">
                            <img class="recipe-list__img" src="images/recipe1.jpg" alt="レシピ1の写真" width="400" height="500" loading="lazy">
                        </a>
                    </li>
                    <li class="recipe-list__item">
                        <a class="recipe-list__link" href="#">
                            <img class="recipe-list__img" src="images/recipe2.jpg" alt="レシピ2の写真" width="400" height="500" loading="lazy">
                        </a>
                    </li>
                    <li class="recipe-list__item">
                        <a class="recipe-list__link" href="#">
                            <img class="recipe-list__img" src="images/recipe3.jpg" alt="レシピ3の写真" width="400" height="500" loading="lazy">
                        </a>
                    </li>
                </ul>
            </div>
            <div class="main__action">
                <a href="#" class="main__button">レシピ一覧を見る</a>
            </div>
        </main>
        <footer class="footer">
            <nav class="footer__nav">
                <ul class="footer__list">
                    <li class="footer__item">
                        <a class="footer__link" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
                    </li>
                    <li class="footer__item">
                        <a class="footer__link" href="https://x.com" target="_blank" rel="noopener noreferrer">Twitter</a>
                    </li>
                    <li class="footer__item">
                        <a class="footer__link" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
                    </li>
                </ul>
            </nav>
            <small class="footer__copyright">&copy; 2021 Recipe Diary</small>
        </footer>
    </div>
</body>
</html>
