<!DOCTYPE heml>
<html long=-"ja">
<head>
    <meta charset="UTF-8">
    <title>HTMLの基本構造</title>
</head>
<body>
    <h1>HTMLの基本構造</h1>
    <p>これは完全なHTMLファイルです。</p>

    <h2>herdタグに書くもの</h2>
    <ul>
        <li>meta charset(文字コード)</li>
        <li>title(ページタイトル)</li>    
    </ul>
    <h2>bodyタグに書くもの</h2>
    <ul>
        <li>見出し(h1-h6)</li>
        <li>段落(p)</li>
        <li>リスト(ul,ol,li)</li>
        <li>その他、表示したいコンテンツ</li>
    </ul>
</body>
</html>
